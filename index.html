<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>HAPPYpoint</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

/* เมนูบน */
.nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: #111827;
}

.nav a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
}

/* ส่วนหัว */
.hero {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(135deg,#ff4d6d,#3b82f6);
}

/* กล่องเนื้อหา */
.section {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}

/* ปุ่ม */
.btn {
  display: inline-block;
  padding: 10px 15px;
  background: #3b82f6;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}

/* footer */
footer {
  text-align: center;
  padding: 20px;
  background: #111827;
  margin-top: 30px;
}
</style>

</head>

<body>

<!-- เมนู -->
<div class="nav">
  <div><b>HAPPYpoint</b></div>
  <div>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- ส่วนหัว -->
<div class="hero">
  <h1>🎉 HAPPYpoint</h1>
  <p>รวมลิงก์ร้านค้า โซเชียล และข้อมูลของเรา</p>
</div>

<!-- เนื้อหา -->
<div class="section">

  <h2>📱 Social Media</h2>
  <div class="card">
    Facebook / TikTok / Instagram
    <br><br>
    <a class="btn" href="#">เข้าไปดู</a>
  </div>

  <h2>🛒 Shop</h2>
  <div class="card">
    ร้านค้าออนไลน์ของ HAPPYpoint
    <br><br>
    <a class="btn" href="#">ไปที่ร้าน</a>
  </div>

  <h2>📞 Contact</h2>
  <div class="card">
    ติดต่อเรา: happypoint@gmail.com
  </div>

</div>

<!-- footer -->
<footer>
  © 2026 HAPPYpoint
</footer>

</body>
</html>
